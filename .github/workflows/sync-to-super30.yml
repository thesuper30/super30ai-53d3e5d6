name: Test Super30 Secret

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check secret
        env:
          TEST_KEY: ${{ secrets.SUPER30_DEPLOY_KEY }}
        run: |
          if [ -z "$TEST_KEY" ]; then
            echo "SECRET IS EMPTY"
            exit 1
          else
            echo "SECRET EXISTS"
            echo "Length: ${#TEST_KEY}"
          fi
