name: Sync to Super30

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Super30 repository
        run: |
          git remote add destination https://x-access-token:${{ secrets.SUPER30_PAT }}@github.com/thesuper30/super30ai.git

      - name: Fetch Super30 repository
        run: |
          git fetch destination

      - name: Push to Super30 sync branch
        run: |
          git push destination HEAD:refs/heads/lovable-sync --force
